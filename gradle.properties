# ---- Gradle ----
# NOTE: building inside the DSH sandbox on Windows needs one extra JVM flag, because the
# sandbox makes java.nio.file.Files.isWritable() report false for every path and the JDK's
# zip filesystem then opens jars read-only. See README "在 DSH 沙箱里编译" for the one-liner.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---- Minecraft / Fabric toolchain ----
# Target platform: Minecraft 1.21.11 (Fabric). Java 21 is required.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
loom_version=1.14.10
fabric_version=0.141.6+1.21.11
# Gradle distribution under tools/ this toolchain needs (Loom 1.14 requires Gradle 9.2+).
gradle_version=9.2.1

# ---- Mod metadata ----
mod_version=1.0.0
maven_group=com.dsh.lightningsword
archives_base_name=lightning-sword-mc1.21.11
