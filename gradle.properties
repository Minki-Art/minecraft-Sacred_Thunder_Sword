# ---- Gradle ----
# NOTE: building inside the DSH sandbox on Windows needs one extra JVM flag, because the
# sandbox makes java.nio.file.Files.isWritable() report false for every path and the JDK's
# zip filesystem then opens jars read-only. See README "在 DSH 沙箱里编译" for the one-liner.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---- Minecraft / Fabric toolchain ----
# Target platform: Minecraft 1.21.1 (Fabric). Java 21 is required.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.10
loom_version=1.9.2
fabric_version=0.116.17+1.21.1

# ---- Mod metadata ----
mod_version=1.0.0
maven_group=com.dsh.lightningsword
archives_base_name=lightning-sword
